[project]
name = "finans-tracker-banking-service"
version = "0.1.0"
description = "Banking microservice for Finans Tracker (Enable Banking integration)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "aio-pika>=9.0",
    # The app signs Enable Banking JWTs with PyJWT (adapters/outbound/
    # enable_banking_client.py). python-jose is a *test-only* dependency here and
    # lives in the dev group — P3-23 found it in the runtime list, where it put two
    # CVEs (P3-26) into the image for no runtime reason.
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "finans-tracker-auth",
    "finans-tracker-contracts",
    "finans-tracker-messaging",
]

# Three packages, not four: banking imports contracts, auth and messaging.
# `domain` is not imported anywhere under app/ or tests/ and is deliberately absent.
[tool.uv.sources]
finans-tracker-auth = { path = "../shared/auth" }
finans-tracker-contracts = { path = "../shared/contracts" }
finans-tracker-messaging = { path = "../shared/messaging" }

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "pytest",
    "pytest-asyncio",
    # conftest points DATABASE_URL at sqlite+aiosqlite so the suite runs without a
    # live Postgres. Test-only, and now expressible as such.
    "aiosqlite>=0.20.0",
    # tests/integration/test_bank_api.py mints tokens with `from jose import jwt`.
    # >=3.4.0 is the fix for CVE-2024-33663 / CVE-2024-33664, which the deleted
    # requirements.txt pinned *below* at 3.3.0.
    "python-jose[cryptography]>=3.4.0",
    "types-python-jose",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
