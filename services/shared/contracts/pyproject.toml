[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finans-tracker-contracts"
version = "0.4.0"
description = "Shared event contracts for inter-service communication"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["contracts"]

[tool.hatch.build]
include = ["contracts/**/*.py", "contracts/py.typed"]
