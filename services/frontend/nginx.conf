# P3-43 / ADR-0005: denne fil ER sikkerhedsperimeteren.
#
# Browseren taler med præcis én origin (denne server). Hver backend-rute er en
# EKSPLICIT location-blok — der er med vilje ingen `location /api/` catch-all, fordi
# `/api/v1/internal/*` (account) og `/api/v1/categorize` (categorization) er
# INTERNAL_API_KEY-vogtede service-til-service-ruter som en catch-all ville publicere.
# Konsekvensen er at filen samtidig er den eneste præcise beskrivelse af systemets
# offentlige overflade. `scripts/compose_check.py` rule 5 vogter den mod drift.
#
# Upstream-portene er CONTAINER-porte, ikke browserens portnumre. To afviger:
# account-service lytter på 8003 (compose mapper 8004:8003) og ai-service på 8004
# (8007:8004). Samme navne virker i k8s, hvor Service-portene er identiske med
# container-portene.
#
# Navnene slås op ved opstart, ikke per request: mangler en upstream-container når
# nginx starter, starter nginx slet ikke ("host not found in upstream"). Derfor har
# frontend-servicen `depends_on` på alle ti i docker-compose.yml.

# --- RATE LIMIT-ZONE (P2-27) ---------------------------------------------------------
#
# Ligger her, UDEN FOR `server`, fordi `limit_req_zone` kun er gyldig i http-kontekst.
# Det virker, fordi Dockerfilen kopierer filen til /etc/nginx/conf.d/default.conf, som
# nginx inkluderer inde fra sin egen `http`-blok. Flyttes den ind i `server`, starter
# nginx ikke.
#
# MÅLT, og det ændrer hvad zonen betyder: `$remote_addr` er **192.168.65.1** for al
# host-trafik — Docker Desktops gateway, ikke klientens IP. Nøglen er altså konstant
# fra hostens synspunkt, så zonen opfører sig som ÉN GLOBAL bucket her, ikke som
# per-klient. Requests fra andre containere på compose-netværket har hver deres IP og
# får hver deres bucket; det er verificeret. Konsekvensen for tuning: grænsen skal kunne
# bære en enkelt legitim bruger der taster forkert flere gange, for den bruger deler
# bucket med alle andre der rammer via hosten.
#
# 10r/m + burst=5 nodelay: fem forsøg i træk går igennem straks, derefter ét hvert
# sjette sekund. Målt: præcis 6 slipper igennem på en frisk zone, derefter 429. Det er
# tallet man skruer på — ikke formen — hvis et normalt login-flow rammer grænsen. Zonerne
# er 10m, hvilket er rigeligt: de holder én nøgle hver i praksis.
#
# TO ZONER, ikke én, og det er en måling der tvang det: med login og register i samme zone
# gav 12 × register 6 × 409 og 6 × 429, hvorefter login svarede 429 med det samme. De delte
# bucket. Kombineret med at al host-trafik har samme nøgle betyder det, at nogen der hamrer
# register kan spærre alles login — en selv-DoS-sti indført af bremsen selv. Separate zoner
# koster én linje og fjerner den.
#
# 429, ikke nginx' default 503: 503 siger "serveren er nede", hvad der er den forkerte
# diagnose at give en klient der selv er årsagen.
#
# HVAD ZONEN IKKE DÆKKER — læs dette før den betragtes som en bremse: den gælder kun
# trafik gennem perimeteren. Service-portene 8001–8012 er stadig på 0.0.0.0 (ADR-0005
# punkt 3), så `POST 127.0.0.1:8001/api/v1/users/login` møder ingen limiter. Målt som
# kontrol i P2-27, og vores egen `tests/e2e/` er beviset: den rammer portene direkte, og
# derfor er den upåvirket af denne fil. Trusselmodellen er den browser-vendte overflade.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nedarves til alle location-blokke nedenfor. `Authorization` og `X-Account-ID`
    # videresendes automatisk (nginx dropper kun headers med underscore), og de er
    # obligatoriske på chat-stream — se ai-service/app/adapters/inbound/stream_api.py.
    # $http_host, IKKE $host: $host stripper portnummeret. FastAPI's
    # trailing-slash-redirect bygger sin absolutte Location ud fra Host, så med $host
    # svarede /api/v1/accounts med `Location: http://127.0.0.1/api/v1/accounts/` —
    # port 80, hvor intet lytter. Målt: curl exit 7 på at følge den. Flere ruter rammes
    # (accounts, goals kaldes uden trailing slash fra crudFactory), så det ville have
    # været en halv frontend, ikke en enkelt knap.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Defaulten er 1m. Den ville afvise CSV-imports med nginx' egen HTML-413 længe før
    # transaction-services CSV_MAX_BYTES (10 MiB) og dens danske fejlbesked kom i spil.
    # Per-location hævet dér hvor der uploades; alt andet beholder den snævre default.
    client_max_body_size 1m;

    # Vites hash-navngivne tekst-assets er stabile og komprimerbare. HTML holdes uden
    # immutable caching, så en deploy kan pege browseren på de nye hashes med det samme.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- SECURITY HEADERS (P3-25) ---------------------------------------------------
    #
    # `always` på alle fire, IKKE af forsigtighed: uden det sætter nginx kun headeren på
    # en hvidliste af statuskoder (200, 201, 204, 206, 3xx). Deny-backstoppen nedenfor
    # returnerer 404, og fejl-svar er ikke det sted man vil mangle dem.
    #
    # FÆLDE: `add_header` nedarves kun til en `location` der ikke selv sætter én. Filen har
    # bevidst ingen andre `add_header` — får en location sin egen (fx `Cache-Control:
    # immutable` på assets, som P3-28 vil gøre), forsvinder alle fire her TAVST i den
    # location. Gentag dem dér. P3-47 er vagten der skal fange det.
    #
    # Hvert CSP-direktiv er målt på det byggede bundle 2026-07-28, ikke valgt på skøn —
    # begrundelsen står her, fordi et direktiv uden begrundelse bliver løsnet af den næste
    # der møder en violation:
    #   script-src 'self'          0 × `eval(` og 0 × `new Function` i bundlet, så
    #                              'unsafe-eval' er ikke nødvendig.
    #   style-src  'unsafe-inline' TVUNGET, men af ÉN grund: `react-remove-scroll` (radix'
    #                              scroll-lock) laver `createElement("style")` og fylder den
    #                              med `appendChild(createTextNode(...))` — et inline
    #                              stylesheet, som style-src blokerer. Målt isoleret: uden
    #                              'unsafe-inline' giver præcis den mekanisme
    #                              "Applying inline style violates ...".
    #                              De 35 × `style={{…}}` i src/ er IKKE grunden — det var en
    #                              fejlslutning i første udgave af denne kommentar. React
    #                              sætter dem via CSSOM (`element.style.x = y`), og CSP rører
    #                              ikke CSSOM: målt 24 style-attributter renderet under
    #                              `style-src 'self'` med NUL violations.
    #                              Biblioteket understøtter en nonce via `__webpack_nonce__`,
    #                              men Vite sætter den ikke, så nonce-vejen findes ikke i dag.
    #   img-src/font-src 'self'    0 × `data:`/`blob:`-URI og 0 × `url()` i den byggede CSS.
    #   connect-src 'self'         alle kald er relative efter P3-43. Bundlets
    #                              `http://localhost` er react-routers SSR-fallback-base
    #                              (overskrives af window.location.origin), ikke et fetch-mål.
    #   frame-ancestors 'none'     dublerer X-Frame-Options med vilje: denne er den der
    #                              gælder, headeren er for browsere der ikke læser CSP.
    #
    # Bemærk hvad der IKKE er her: Strict-Transport-Security. Der findes ingen TLS i repoet
    # (0 hits på `listen 443`/`ssl_certificate`), og browsere ignorerer HSTS over HTTP per
    # spec — headeren ville være inert og læses som dækning ved næste audit. Hører til den
    # dag der findes en TLS-terminering.
    #
    # CSP'en kan IKKE verificeres af repoets tests: de 344 frontend-tests kører i jsdom, som
    # ikke håndhæver CSP, og der er ingen Playwright. Ændrer du den, så driv appen i en
    # browser med konsollen åben — recharts på dashboardet og en radix-dialog er de to
    # steder der brækker først.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # DENY-BACKSTOP. Ikke en catch-all proxy — det modsatte. Uden den falder enhver
    # ikke-allowlistet /api/-sti ned i SPA-fallbacken og svarer 200 + index.html.
    # Målt 2026-07-28: /api/v1/internal/accounts/1/exists og /api/v1/categorize/ gav
    # begge 200 text/html. Ruterne var ikke eksponeret — men "ikke eksponeret" så ud
    # som "virker", og en glemt proxy-regel ville se præcis lige sådan ud.
    # Præfikset er kortere end alle allowlist-blokke, så nginx' længste-match lader
    # dem vinde; kun det uspecificerede rammer denne.
    location /api/ {
        return 404;
    }

    # --- user-service (8001) ---
    # ADVARSEL (P3-44): GET /api/v1/users/{id} er INTERNAL_API_KEY-vogtet, men ligger
    # ikke under et /internal/-segment, så denne præfiks-regel eksponerer den. Guarden
    # afviser stadig uden nøgle — det er ikke en bypass, men en S2S-rute på den
    # offentlige overflade. P3-44 flytter den; en regex-deny her blev fravalgt, fordi
    # den ville skabe en ordningsafhængighed ingen test fanger når den brydes.
    # RATE LIMIT (P2-27) på de to uautentificerede ruter i systemet. De er PRÆFIKS-
    # locations uden modifier med vilje: `location = /api/v1/users/login` ville være mere
    # præcis, men rule 5 i scripts/compose_check.py afviser enhver modifier, fordi den
    # kun kan ræsonnere om præfiks-match og nægter at passere en blok den ikke har
    # analyseret. Præfikset er længere end `/api/v1/users`, og nginx vælger længste match,
    # så disse to vinder — men netop derfor nedarver de IKKE noget, og `proxy_pass` skal
    # gentages her. Fjern den, og login svarer 404 fra SPA-fallbacken.
    #
    # register er med, selvom eksistensleaket via 409 er et selvstændigt problem: leaket
    # er kun værd at høste i mængde, og grænsen gør mængden dyr uden at foregive at rette
    # årsagen.
    location /api/v1/users/login {
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://user-service:8001;
    }

    location /api/v1/users/register {
        limit_req zone=auth_register burst=5 nodelay;
        proxy_pass http://user-service:8001;
    }

    location /api/v1/users {
        proxy_pass http://user-service:8001;
    }

    # --- transaction-service (8002) ---
    location /api/v1/transactions {
        # 11m, ikke 10m: transaction-service skal selv nå at afvise på CSV_MAX_BYTES og
        # svare med sin egen besked. nginx er backstoppet bagved, ikke den der taler.
        client_max_body_size 11m;
        proxy_pass http://transaction-service:8002;
    }

    location /api/v1/planned-transactions {
        proxy_pass http://transaction-service:8002;
    }

    # --- budget-service (8003) ---
    location /api/v1/monthly-budgets {
        proxy_pass http://budget-service:8003;
    }

    location /api/v1/budgets {
        proxy_pass http://budget-service:8003;
    }

    # --- account-service (container-port 8003, IKKE 8004) ---
    location /api/v1/accounts {
        proxy_pass http://account-service:8003;
    }

    location /api/v1/account-groups {
        proxy_pass http://account-service:8003;
    }

    # --- categorization-service (8005) ---
    # /api/v1/categorize er BEVIDST fraværende: INTERNAL_API_KEY-vogtet S2S-rute.
    location /api/v1/categories {
        proxy_pass http://categorization-service:8005;
    }

    location /api/v1/subcategories {
        proxy_pass http://categorization-service:8005;
    }

    location /api/v1/rules {
        proxy_pass http://categorization-service:8005;
    }

    # --- goal-service (8006) ---
    location /api/v1/goals {
        proxy_pass http://goal-service:8006;
    }

    # --- ai-service (container-port 8004, IKKE 8007) ---
    # SSE: POST /api/v1/chat/stream returnerer EventSourceResponse. Servicen sender selv
    # `X-Accel-Buffering: no`, men den redder kun buffering — timeouten er den der binder,
    # fordi defaultens 60s dræber en lang router→dispatcher→responder-pipeline midtvejs.
    location /api/v1/chat {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_pass http://ai-service:8004;
    }

    # --- notification-service (8008) ---
    location /api/v1/notifications {
        proxy_pass http://notification-service:8008;
    }

    # --- banking-service (8009) ---
    location /api/v1/bank {
        proxy_pass http://banking-service:8009;
    }

    # --- gateway-service (8010), CQRS-læsesiden ---
    location /api/v1/graphql {
        proxy_pass http://gateway-service:8010;
    }

    location /api/v1/sagas {
        proxy_pass http://gateway-service:8010;
    }

    # Vite skriver kun content-hash-navngivne filer her. En location-lokal add_header
    # stopper nginx' normale header-arv, så perimeterens fire security headers gentages
    # eksplicit og vogtes af compose-check rule 5 / P3-47.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA fallback: serve index.html for client-side routes
    # (e.g. /dashboard, /login, /bank/callback) so React Router can handle them
    # on full page loads / OAuth redirects instead of nginx returning 404.
    #
    # Rækkefølgen betyder intet for præfiks-locations — nginx vælger det længste match,
    # ikke det første. Til gengæld betyder DENNE blok at en glemt proxy-regel ovenfor
    # ikke giver 404, men 200 + index.html: fejlen viser sig som "API'et returnerer
    # HTML" langt nede i frontenden. Derfor verificeres nye regler med `curl -i`.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
