# P3-43 / ADR-0005: denne fil ER sikkerhedsperimeteren.
#
# Browseren taler med præcis én origin (denne server). Hver backend-rute er en
# EKSPLICIT location-blok — der er med vilje ingen `location /api/` catch-all, fordi
# `/api/v1/internal/*` (account) og `/api/v1/categorize` (categorization) er
# INTERNAL_API_KEY-vogtede service-til-service-ruter som en catch-all ville publicere.
# Konsekvensen er at filen samtidig er den eneste præcise beskrivelse af systemets
# offentlige overflade. `scripts/compose_check.py` rule 5 vogter den mod drift.
#
# Upstream-portene er CONTAINER-porte, ikke browserens portnumre. To afviger:
# account-service lytter på 8003 (compose mapper 8004:8003) og ai-service på 8004
# (8007:8004). Samme navne virker i k8s, hvor Service-portene er identiske med
# container-portene.
#
# Navnene slås op ved opstart, ikke per request: mangler en upstream-container når
# nginx starter, starter nginx slet ikke ("host not found in upstream"). Derfor har
# frontend-servicen `depends_on` på alle ti i docker-compose.yml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nedarves til alle location-blokke nedenfor. `Authorization` og `X-Account-ID`
    # videresendes automatisk (nginx dropper kun headers med underscore), og de er
    # obligatoriske på chat-stream — se ai-service/app/adapters/inbound/stream_api.py.
    # $http_host, IKKE $host: $host stripper portnummeret. FastAPI's
    # trailing-slash-redirect bygger sin absolutte Location ud fra Host, så med $host
    # svarede /api/v1/accounts med `Location: http://127.0.0.1/api/v1/accounts/` —
    # port 80, hvor intet lytter. Målt: curl exit 7 på at følge den. Flere ruter rammes
    # (accounts, goals kaldes uden trailing slash fra crudFactory), så det ville have
    # været en halv frontend, ikke en enkelt knap.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Defaulten er 1m. Den ville afvise CSV-imports med nginx' egen HTML-413 længe før
    # transaction-services CSV_MAX_BYTES (10 MiB) og dens danske fejlbesked kom i spil.
    # Per-location hævet dér hvor der uploades; alt andet beholder den snævre default.
    client_max_body_size 1m;

    # DENY-BACKSTOP. Ikke en catch-all proxy — det modsatte. Uden den falder enhver
    # ikke-allowlistet /api/-sti ned i SPA-fallbacken og svarer 200 + index.html.
    # Målt 2026-07-28: /api/v1/internal/accounts/1/exists og /api/v1/categorize/ gav
    # begge 200 text/html. Ruterne var ikke eksponeret — men "ikke eksponeret" så ud
    # som "virker", og en glemt proxy-regel ville se præcis lige sådan ud.
    # Præfikset er kortere end alle allowlist-blokke, så nginx' længste-match lader
    # dem vinde; kun det uspecificerede rammer denne.
    location /api/ {
        return 404;
    }

    # --- user-service (8001) ---
    # ADVARSEL (P3-44): GET /api/v1/users/{id} er INTERNAL_API_KEY-vogtet, men ligger
    # ikke under et /internal/-segment, så denne præfiks-regel eksponerer den. Guarden
    # afviser stadig uden nøgle — det er ikke en bypass, men en S2S-rute på den
    # offentlige overflade. P3-44 flytter den; en regex-deny her blev fravalgt, fordi
    # den ville skabe en ordningsafhængighed ingen test fanger når den brydes.
    location /api/v1/users {
        proxy_pass http://user-service:8001;
    }

    # --- transaction-service (8002) ---
    location /api/v1/transactions {
        # 11m, ikke 10m: transaction-service skal selv nå at afvise på CSV_MAX_BYTES og
        # svare med sin egen besked. nginx er backstoppet bagved, ikke den der taler.
        client_max_body_size 11m;
        proxy_pass http://transaction-service:8002;
    }

    location /api/v1/planned-transactions {
        proxy_pass http://transaction-service:8002;
    }

    # --- budget-service (8003) ---
    location /api/v1/monthly-budgets {
        proxy_pass http://budget-service:8003;
    }

    location /api/v1/budgets {
        proxy_pass http://budget-service:8003;
    }

    # --- account-service (container-port 8003, IKKE 8004) ---
    location /api/v1/accounts {
        proxy_pass http://account-service:8003;
    }

    location /api/v1/account-groups {
        proxy_pass http://account-service:8003;
    }

    # --- categorization-service (8005) ---
    # /api/v1/categorize er BEVIDST fraværende: INTERNAL_API_KEY-vogtet S2S-rute.
    location /api/v1/categories {
        proxy_pass http://categorization-service:8005;
    }

    location /api/v1/subcategories {
        proxy_pass http://categorization-service:8005;
    }

    location /api/v1/rules {
        proxy_pass http://categorization-service:8005;
    }

    # --- goal-service (8006) ---
    location /api/v1/goals {
        proxy_pass http://goal-service:8006;
    }

    # --- ai-service (container-port 8004, IKKE 8007) ---
    # SSE: POST /api/v1/chat/stream returnerer EventSourceResponse. Servicen sender selv
    # `X-Accel-Buffering: no`, men den redder kun buffering — timeouten er den der binder,
    # fordi defaultens 60s dræber en lang router→dispatcher→responder-pipeline midtvejs.
    location /api/v1/chat {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_pass http://ai-service:8004;
    }

    # --- notification-service (8008) ---
    location /api/v1/notifications {
        proxy_pass http://notification-service:8008;
    }

    # --- banking-service (8009) ---
    location /api/v1/bank {
        proxy_pass http://banking-service:8009;
    }

    # --- gateway-service (8010), CQRS-læsesiden ---
    location /api/v1/graphql {
        proxy_pass http://gateway-service:8010;
    }

    location /api/v1/sagas {
        proxy_pass http://gateway-service:8010;
    }

    # SPA fallback: serve index.html for client-side routes
    # (e.g. /dashboard, /login, /bank/callback) so React Router can handle them
    # on full page loads / OAuth redirects instead of nginx returning 404.
    #
    # Rækkefølgen betyder intet for præfiks-locations — nginx vælger det længste match,
    # ikke det første. Til gengæld betyder DENNE blok at en glemt proxy-regel ovenfor
    # ikke giver 404, men 200 + index.html: fejlen viser sig som "API'et returnerer
    # HTML" langt nede i frontenden. Derfor verificeres nye regler med `curl -i`.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
