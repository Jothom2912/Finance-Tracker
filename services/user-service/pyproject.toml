[project]
name = "finans-tracker-user-service"
version = "0.1.0"
description = "User microservice for Finans Tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "aio-pika>=9.4.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "finans-tracker-contracts",
    "finans-tracker-auth",
    "finans-tracker-messaging",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "types-python-jose",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "aiosqlite",
]

[tool.uv.sources]
finans-tracker-contracts = { path = "../shared/contracts" }
finans-tracker-auth = { path = "../shared/auth" }
finans-tracker-messaging = { path = "../shared/messaging" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

# P2-31: samme niveau som analytics-service, som er pilotens reference. Målt på
# denne service koster `disallow_untyped_defs` ingenting — 4 fejl med og uden
# den — fordi annotationerne allerede findes. Ikke `--strict`: det er en
# selvstændig beslutning per service, ikke en del af at komme på gaten.
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
packages = ["app"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
