[project]
name = "finans-tracker-ai-service"
version = "0.1.0"
description = "RAG-based Q&A chat service for Finans Tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "python-jose[cryptography]>=3.3.0",
    "sse-starlette>=2.0.0",
    "anyio>=4.0.0",
    "finans-tracker-auth",
]

[tool.uv.sources]
finans-tracker-auth = { path = "../shared/auth" }

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-archon",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "eval: retrieval/intent quality eval against a live Ollama (excluded from default test run; see tests/eval/conftest.py)",
]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
# Settings() takes no arguments because pydantic-settings fills required fields
# from the environment; without the plugin mypy reads the class body literally.
# init_typed is not optional: the default plugin synthesises an __init__ with
# every field as Any, which is *weaker* than the native dataclass_transform
# handling pydantic v2 already gives mypy.
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_typed = true
