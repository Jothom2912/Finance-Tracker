apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-alert-scheduler
  namespace: finance-tracker
spec:
  replicas: 1
  selector:
    matchLabels: { app: budget-alert-scheduler }
  template:
    metadata:
      labels: { app: budget-alert-scheduler }
    spec:
      containers:
        - name: budget-alert-scheduler
          image: finance-tracker/budget-service:local
          imagePullPolicy: Never
          command: ["python", "-m", "app.workers.budget_alert_scheduler"]
          envFrom:
            - configMapRef:
                name: finance-tracker-config
            - secretRef:
                name: finance-tracker-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: DATABASE_URL_BUDGET
            - name: BUDGET_ALERT_INTERVAL_SECONDS
              value: "21600"
            - name: BUDGET_ALERT_THRESHOLDS
              value: "80,100"
