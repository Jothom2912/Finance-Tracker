apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-month-close-scheduler
  namespace: finance-tracker
spec:
  replicas: 1
  selector:
    matchLabels: { app: budget-month-close-scheduler }
  template:
    metadata:
      labels: { app: budget-month-close-scheduler }
    spec:
      containers:
        - name: budget-month-close-scheduler
          image: finance-tracker/budget-service:local
          imagePullPolicy: Never
          command: ["python", "-m", "app.workers.month_close_scheduler"]
          envFrom:
            - configMapRef:
                name: finance-tracker-config
            - secretRef:
                name: finance-tracker-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finance-tracker-secrets
                  key: DATABASE_URL_BUDGET
            - name: MONTH_CLOSE_INTERVAL_SECONDS
              value: "3600"
            - name: MONTH_CLOSE_DAY
              value: "7"
