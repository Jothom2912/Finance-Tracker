apiVersion: batch/v1
kind: Job
metadata:
  name: user-migration
  namespace: finance-tracker
  labels: { app: user-migration }
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: finance-tracker/user-service:local
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: finance-tracker-config }
            - secretRef: { name: finance-tracker-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: finance-tracker-secrets, key: DATABASE_URL_USER } }
---
