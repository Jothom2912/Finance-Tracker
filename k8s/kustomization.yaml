apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Base namespace, config and secrets
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml

  # Infrastructure
  - infra

  # Explicit schema phase. scripts/k8s-up.sh applies and waits for these Jobs
  # before it applies this complete inventory (P3-17).
  - migrations

  # Backend/API applications
  - apps/user-service.yaml
  - apps/transaction-service.yaml
  - apps/account-service.yaml
  - apps/banking-service.yaml
  - apps/categorization-service.yaml
  - apps/budget-service.yaml
  - apps/goal-service.yaml
  - apps/ai-service.yaml
  - apps/gateway-service.yaml
  - apps/saga-service.yaml
  - apps/analytics-service.yaml
  - apps/notification-service.yaml

  # Frontend
  - apps/frontend.yaml

  # Long-running workers / consumers
  - workers/user-outbox-worker.yaml
  - workers/transaction-outbox-worker.yaml
  - workers/account-outbox-publisher.yaml
  - workers/budget-outbox-worker.yaml
  - workers/categorization-outbox-worker.yaml
  - workers/goal-outbox-worker.yaml
  - workers/banking-outbox-worker.yaml
  - workers/account-service-consumer.yaml
  - workers/categorization-transaction-consumer.yaml
  - workers/categorization-correction-consumer.yaml
  - workers/transaction-categorized-consumer.yaml
  - workers/transaction-taxonomy-consumer.yaml
  - workers/goal-budget-consumer.yaml
  - workers/banking-account-projection-consumer.yaml
  - workers/analytics-projection-consumer.yaml
  - workers/saga-outbox-worker.yaml
  - workers/saga-start-consumer.yaml
  - workers/saga-reply-consumer.yaml
  - workers/saga-timeout-worker.yaml
  - workers/transaction-saga-command-consumer.yaml
  - workers/banking-saga-command-consumer.yaml
  - workers/notification-consumer.yaml
  - workers/banking-sync-scheduler.yaml
  - workers/budget-month-close-scheduler.yaml
  - workers/budget-alert-scheduler.yaml
  - workers/analytics-embedding-consumer.yaml

  # KEDA serverless setup.
  # Note: KEDA itself must be installed first with Helm before this can be applied.
  - keda/keda-rabbitmq-secret.yaml
  - keda/serverless-health-trigger-auth.yaml
  - keda/serverless-health-scaledjob.yaml
  - keda/serverless-health-init-job.yaml

  # Autoscaling for long-running API services
  - autoscaling/hpa.yaml

  # Monitoring and logging stack running inside Kubernetes
  - monitoring
