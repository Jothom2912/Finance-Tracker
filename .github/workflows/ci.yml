name: All services CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # The per-service jobs below lint only their own directory, and the Makefile's
  # lint target iterates the same list — so scripts/ and the root tests/ were in
  # no perimeter at all. Both had unnoticed formatting drift when this job was
  # added (2026-07-26), and scripts/ holds tools that write directly to service
  # databases.
  #
  # This also backstops .githooks/pre-commit: hooks are per-clone, opt-in via
  # `make install-hooks`, and bypassable with --no-verify, so they cannot
  # guarantee anything about master. One ruff invocation is valid repo-wide
  # because no service defines its own [tool.ruff] — all inherit ruff.toml.
  #
  # Runs first and independently: it needs no dependencies, so it reports in
  # well under a minute instead of waiting on twelve `uv sync`s.
  repo-lint:
    name: Repo-wide lint (incl. scripts/, tests/)
    runs-on: ubuntu-latest

    # P2-38. Målt baseline over 10 grønne master-kørsler: p50 10 s, max 13 s.
    # 3x max ville være 40 s — for stramt til at en langsom setup-python ikke
    # gør jobbet rødt. Gulvet er 5 min; formålet er at konvertere GitHubs
    # 360 min-default til minutter, ikke at fange langsomhed.
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check services scripts tests

      - name: Ruff format check
        run: ruff format --check services scripts tests

      # P3-40 + P2-37. Belongs in this job rather than a Docker one because both
      # rules are static reads — docker-compose.yml and the presence of files under
      # services/* — stdlib only, no daemon, no build. The regressions they catch
      # (a worker re-growing its own `build:` block; a service growing a second
      # install path) both show up as a *passing* verification against code that
      # isn't shipping, so neither can depend on anyone thinking to look.
      - name: Build-hygiene check (image sharing + install paths)
        run: python3 scripts/compose_check.py

  python-services:
    name: ${{ matrix.service }} - Python 3.11
    runs-on: ubuntu-latest

    # P2-38. Dette er jobbet fundet handler om: analytics' `Run tests` sad 836 s
    # (13,9 min) mod en baseline på 36 s, og ville have siddet til 360 min.
    # Målt over 120 job-instanser: p50 26 s, max 120 s (analytics, p50 83 s).
    # 8 min = 3x max plus luft til at analytics' ES-image-pull varierer — og
    # stadig under de 13,9 min hængningen kostede, så den ville være fanget.
    timeout-minutes: 8

    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - gateway-service
          - user-service
          - transaction-service
          - budget-service
          - goal-service
          - ai-service
          - categorization-service
          - banking-service
          - saga-service
          - analytics-service
          - notification-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    env:
      PYTHONPATH: ${{ github.workspace }}/services/shared/contracts:${{ github.workspace }}/services/shared:${{ github.workspace }}/services/${{ matrix.service }}:${{ github.workspace }}
      TESTING: "1"
      JWT_SECRET: test-secret
      INTERNAL_API_KEY: test-api-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install uv pytest pytest-asyncio ruff bandit

      - name: Install dependencies
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --dev
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No pyproject.toml or requirements.txt found"
            exit 1
          fi

      - name: Ruff lint
        run: |
          if [ -f pyproject.toml ]; then
            uv run ruff check .
          else
            ruff check .
          fi

      - name: Ruff format check
        run: |
          if [ -f pyproject.toml ]; then
            uv run ruff format --check .
          else
            ruff format --check .
          fi

      # P2-31: the typecheck gate, rolled out one service at a time.
      # TYPECHECK_SERVICES is the allowlist — putting a service's name here is
      # what turns its annotations from documentation into a constraint, and is
      # the only edit needed to enrol it (plus mypy + [tool.mypy] in its
      # pyproject). Removing a name is the rollback.
      #
      # A shell conditional rather than a job-level `if:` on purpose: an `if:`
      # skipped step renders as "skipped" in the UI, which reads the same as
      # "fine" at a glance. That ambiguity is what P3-40 cost us, so the
      # else-branch prints a notice and the log always states which it was.
      #
      # No `--ignore-missing-imports` and no MYPYPATH: shared/{contracts,domain,
      # auth,messaging} are resolved as installed packages via their py.typed
      # markers. Without those markers a cross-package type silently becomes
      # `Any` and this step goes green on exactly the bug it exists to catch
      # (measured — see the finding).
      - name: Typecheck (mypy)
        env:
          TYPECHECK_SERVICES: "analytics-service user-service notification-service ai-service budget-service saga-service transaction-service categorization-service banking-service"
        run: |
          if [[ " $TYPECHECK_SERVICES " == *" ${{ matrix.service }} "* ]]; then
            uv run mypy
          else
            echo "::notice::typecheck not enabled for ${{ matrix.service }} (P2-31 rollout)"
          fi

      # -ll -ii: fail on findings that are MEDIUM+ severity AND MEDIUM+
      # confidence. Low-severity findings (B101 asserts in consumers, B110,
      # B105 on an empty-string default) are accepted noise for this codebase;
      # medium+ findings must be fixed or nosec'ed with a justification.
      - name: Bandit security scan
        run: |
          if [ ! -d app ]; then
            echo "::error::services/${{ matrix.service }} has no app/ directory - bandit has nothing to scan"
            exit 1
          fi
          bandit -r app -x tests -ll -ii

      - name: Run tests
        run: |
          if [ "${{ matrix.service }}" = "goal-service" ]; then
            if [ -f pyproject.toml ]; then
              uv run pytest tests -v -k "not adr_0003_goal_allocation_migration"
            else
              pytest tests -v -k "not adr_0003_goal_allocation_migration"
            fi
          else
            if [ -f pyproject.toml ]; then
              uv run pytest tests -v
            else
              pytest tests -v
            fi
          fi

  # The shared packages were outside CI entirely, even though all 12 services
  # import them — a break here is worse than a break in one service. Three of
  # them were in fact failing `ruff format --check` on committed code, unnoticed
  # (fixed in 3f003510).
  #
  # `domain` was left out of that fix and stayed uncovered until 2026-07-27 —
  # its 42 tests had never run here. It was invisible because adding it would
  # have *failed*: it used the legacy `[project.optional-dependencies] dev`
  # form, so `uv sync --dev` uninstalled pytest and installed nothing, and
  # `uv run pytest` died with `Failed to spawn`. Converted to
  # `[dependency-groups]` like the other three. Keep all four in this list;
  # the matrix is the only thing that makes a shared package's tests real.
  #
  # Separate job rather than matrix entries in python-services: that job's
  # bandit step hard-fails when there is no `app/` directory, and these
  # packages are libraries, not services.
  shared-packages:
    name: shared/${{ matrix.package }} - Python 3.11
    runs-on: ubuntu-latest

    # P2-38. Målt over 40 job-instanser: p50 14 s, max 20 s. Samme gulv på
    # 5 min som repo-lint, af samme grund.
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        package:
          - contracts
          - messaging
          - auth
          - domain

    defaults:
      run:
        working-directory: services/shared/${{ matrix.package }}

    env:
      JWT_SECRET: test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install uv ruff bandit

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Same -ll -ii threshold as the services; scans the package directory
      # since there is no app/.
      - name: Bandit security scan
        run: bandit -r ${{ matrix.package }} -ll -ii

      - name: Run tests
        run: uv run pytest tests -v

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    # P2-38. Målt over 10 kørsler: p50 48 s, max 56 s. 3x max = 2,8 min, hævet
    # til gulvet på 5 min så en npm-cache-miss ikke er det der rammer grænsen.
    timeout-minutes: 5

    defaults:
      run:
        working-directory: services/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e-tests:
    name: E2E / System cooperation tests
    runs-on: ubuntu-latest
    needs:
      - python-services
      - frontend

    # P2-39: jobbet havde INTET timeout, og det er ikke teoretisk — P2-38 er fundet om et
    # CI-job der hang i 6 timer uden signal. Browser-suiten tilføjer netop den slags
    # risiko (en hængende chromium ser ud som ingenting), så bremsen hører her. 30 min er
    # rigeligt: jobbet tager ~8-10 min med `compose up --build` som den dyre del.
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}/services/shared/contracts:${{ github.workspace }}/services/shared:${{ github.workspace }}
      TESTING: "1"
      JWT_SECRET: test-secret
      INTERNAL_API_KEY: test-api-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install uv pytest pytest-asyncio requests httpx python-jose

      - name: Install root/backend dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # --- browser-suiten (P2-39) -----------------------------------------------------
      # Ligger i DETTE job, ikke i et nyt, fordi et nyt job ville koste en anden fuld
      # `docker compose up --build` (~6 min) for at måle mod samme stak. Se
      # dev-notes/decisions/2026-07-28-browser-automation-instrument.md.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install frontend dev dependencies
        working-directory: services/frontend
        run: npm ci

      # Browser-binæren, ikke npm-pakken. Nøglen er lockfilen, fordi det er den der
      # bestemmer @playwright/test-versionen — og en browser fra en anden version er
      # præcis den slags stille mismatch der giver "virker lokalt, ikke i CI".
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('services/frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: services/frontend
        run: npx playwright install --with-deps chromium

      # banking-service konstruerer `EnableBankingClient` PER REQUEST, og konstruktøren
      # læser PEM'en (enable_banking_client.py:71). Servicen starter derfor fint uden en
      # nøgle — migrations kører, `/health` svarer 200 — og fejler først på
      # `GET /api/v1/bank/connections`, som dashboardet kalder ved hver load. Målt af
      # P2-39's to første CI-kørsler; det er grunden til at et `/health`-probe på 8009
      # ikke kan fange det.
      #
      # Compose bind-mounter `./enablebanking-sandbox.pem`. Findes filen ikke, laver Docker
      # en MAPPE på mount-punktet (→ `IsADirectoryError`, ikke "file not found").
      #
      # `chmod 644` er ikke kosmetik: `openssl genrsa` skriver 600 ejet af runneren, og
      # containeren kører som en anden bruger → `PermissionError`. Første forsøg rettede kun
      # eksistensen og flyttede dermed fejlen ét trin, ikke væk.
      #
      # En throwaway-nøgle er nok, fordi CI ikke kalder Enable Banking: den skal kunne læses
      # og kunne signere RS256.
      - name: Generate throwaway Enable Banking key
        run: |
          openssl genrsa -out enablebanking-sandbox.pem 2048
          chmod 644 enablebanking-sandbox.pem

      - name: Start system
        run: docker compose up -d --build

      # Poll the same health endpoints tests/e2e/conftest.py gates on, so the
      # suite never starts against a half-started system. Fails loudly with
      # compose status instead of silently skipping.
      - name: Wait for system
        run: |
          deadline=$(( $(date +%s) + 180 ))
          # 8009 (banking) tilføjet af P2-39, men vær klar over hvad det IKKE beviser:
          # banking-service svarede `/health` 200 gennem hele den kørsel hvor
          # `/bank/connections` gav 500, fordi PEM'en først læses per request. Et
          # health-probe kan altså ikke se en brudt afhængighed — det ser kun at processen
          # lever. Porten er med fordi en reelt død service ellers passerer lydløst.
          #
          # P2-42b lukkede det for banking: `Check banking dependency readiness` nedenfor
          # rammer `/ready`, som rører DB og Enable Banking-konfigurationen. Loopet her
          # er stadig kun liveness for alle 12 — og det skal det være, ellers ville en
          # valgfri, ukonfigureret integration blokere hele opstarten. De 11 andre
          # services har ikke et `/ready` endnu; det er et opfølgnings-item, ikke en
          # antagelse om at de er dækket.
          #
          # P2-38: 8007 (ai), 8008 (notification), 8011 (saga) tilføjet. Det var de tre
          # sidste af de 12 HTTP-services uden en opstarts-gate — de øvrige 41
          # compose-services er 14 datastores (som har compose-healthcheck +
          # `depends_on: service_healthy`), frontend/nginx (port 3000 nedenfor) og 26
          # workers uden HTTP-overflade, hvor et portprobe ikke er *manglende* men
          # strukturelt umuligt. Workernes gate er container-tilstand, ikke en port.
          #
          # 8007 ser dyr ud og er gratis, målt: `ai-service` har
          # `depends_on: ollama-pull: service_completed_successfully`, så den starter
          # først når qwen3:4b + bge-m3 (3,7 GB, og CI cacher dem ikke) er pullet. MEN
          # `docker compose up -d` blokerer selv på den betingelse, så pullet betales i
          # `Start system` — målt 173-183 s over tre kørsler — og er færdigt før
          # deadlinen herunder begynder at tælle. Derfor er dette step kun 3-7 s i dag.
          # Konsekvensen hvis det ændrer sig: fejlen rammer `Start system`, ikke denne
          # deadline, og den er allerede rød ved en fejlet depends_on-betingelse.
          for port in 8001 8002 8003 8004 8005 8006 8007 8008 8009 8010 8011 8012; do
            until curl -fsS "http://localhost:${port}/health" > /dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Service on port ${port} did not become healthy within 180s"
                docker compose ps
                exit 1
              fi
              sleep 3
            done
            echo "port ${port}: healthy"
          done

          # Port 3000 er IKKE en af ovenstående, og det er ikke en detalje: loopet
          # ventede kun på 8001-8012, så browser-suiten kunne starte mod en frontend der
          # ikke var oppe endnu. Perimeteren har intet /health — nginx starter slet ikke
          # hvis en upstream mangler ("host not found in upstream"), så at index.html
          # svarer ER health-checket her.
          until curl -fsS "http://127.0.0.1:3000/" > /dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Perimeteren (port 3000) svarede ikke inden for tidsgrænsen"
              docker compose ps
              docker compose logs frontend
              exit 1
            fi
            sleep 3
          done
          echo "port 3000 (perimeter): svarer"

      # P2-38/P2-42. Hard gate, and it covers a class `Wait for system` structurally
      # cannot: 26 of the 53 compose services are workers with no HTTP surface, so a
      # port probe is not "missing" for them — it is impossible. A worker crashing on
      # import kept this job green because the E2E tests do not touch its queue.
      #
      # Belongs here rather than in its own job: this is the only job with a compose
      # stack up, and a new one would cost a second `up --build` (~3 min) — the same
      # argument P2-39's decision note makes about the browser suite.
      #
      # Runs BEFORE the test steps: a dead worker should be reported as a dead worker,
      # not as whatever downstream assertion happens to fail because of it.
      - name: Check no container is dead or restarting
        run: python3 scripts/compose_state_check.py

      # P2-42b. Tredje klasse af opstartsfejl, ved siden af de to ovenfor: processen
      # lever (`Wait for system` grøn) OG containeren er ikke i restart-loop
      # (`compose_state_check.py` grøn), men en afhængighed er ubrugelig. Præcis den
      # tilstand banking var i 2026-07-28, hvor begge de to gates var grønne mens hver
      # bank-rute gav 500 —
      # dev-notes/findings/2026-07-28-banking-service-dead-in-ci.md.
      #
      # Gaten er MED VILJE strengere end proben. `/ready` svarer 200 + "degraded" ved
      # manglende PEM, fordi Enable Banking er en valgfri integration og k8s ikke skal
      # tage poden ud af service over den (P2-42a). Men her BRUGES bank-sync — steppet
      # `Generate throwaway Enable Banking key` ovenfor genererer en PEM netop for det — så
      # "degraded" er en fejlkonfigureret stak, ikke en gyldig tilstand. Derfor kræves
      # både HTTP 200 og status == "ready".
      #
      # Bodyen echoes altid: en gate hvis log kun siger "success" kan ikke aflæses
      # navngivet bagefter, og det var halvdelen af hvorfor fejlen ovenfor kunne leve i
      # en grøn kørsel.
      - name: Check banking dependency readiness
        run: |
          body=$(curl -fsS --max-time 10 http://localhost:8009/ready) || {
            echo "::error::banking /ready svarede ikke 2xx — DB utilgængelig (503) eller servicen er væk"
            curl -sS -i --max-time 10 http://localhost:8009/ready || true
            docker compose logs banking-service
            exit 1
          }
          echo "banking /ready: ${body}"
          status=$(printf '%s' "${body}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "${status}" != "ready" ]; then
            echo "::error::banking readiness er '${status}', ikke 'ready' — en afhængighed er brudt (se bodyen ovenfor)"
            docker compose logs banking-service
            exit 1
          fi

      # conftest.py aborts (instead of skipping) when services are unreachable
      # and CI is set, so this step can never go green with zero tests run.
      - name: Run E2E tests
        run: pytest tests/e2e -v -ra

      # Hård gate. Kører EFTER Python-suiten, fordi den er den billige at læse først —
      # men de måler forskellige ting: den rammer porte direkte og går uden om
      # perimeteren med vilje, denne kører klienten bag den.
      - name: Run browser tests
        working-directory: services/frontend
        run: npm run test:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            services/frontend/playwright-report/
            services/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop system
        if: always()
        run: docker compose down -v